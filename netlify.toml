[build]
  publish = "public"
  command = "echo 'static site — data built upstream by build.py'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
